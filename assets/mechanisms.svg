<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="702" viewBox="0 0 1000 702" role="img" aria-labelledby="title desc">
<title id="title">Three mechanisms, three different semantics</title><desc id="desc">Move data: storage to resident experts or KV state to compute. Reuse state: a policy chooses reuse or recomputation before the next step; approximation depends on that policy. Propose and verify: a draft tree is checked by the target and yields an accepted prefix.</desc>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#173449}.muted{fill:#5d6d77}.teal{fill:#147b76}.orange{fill:#b9673f}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px}.small{font-size:13px}.body{font-size:14px}.title{font-size:21px;font-weight:650}.line{fill:none;stroke:#147b76;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596" role="img" aria-labelledby="specialization-title specialization-desc">
  <title id="specialization-title">Specialized inference: engines, construction and validation</title>
  <desc id="specialization-desc">Three central subjects form a connected process: construction methods produce specialized inference engines, validation methods check them and feed results back into construction. Benchmarks provide separate tasks and comparison protocols. Diagnostics, construction knowledge and reusable components support the process. The research question is whether building and maintaining specialized execution stacks becomes more practical, with total cost and evidence still to be established.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#177d75" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #193c4d; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #177d75; }
    .title { font-size: 21px; font-weight: 650; }
    .body { font-size: 14px; fill: #536c76; }
    .label { font-size: 12px; font-weight: 600; fill: #177d75; }
    .line { fill: none; stroke: #177d75; stroke-width: 1.6; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="596" rx="20" fill="#f7f6f0"/>
  <text x="36" y="35" class="eyebrow">AWESOME INFERENCE SPECIALIZATION</text>
  <text x="36" y="73" font-size="30" font-weight="650">What do we build, and how do we trust it?</text>
  <text x="36" y="101" class="body">Follow the execution stack from construction to qualified behavior.</text>

  <rect x="22" y="121" width="956" height="225" rx="15" fill="#e8f1eb" stroke="#d4e2d9"/>
  <text x="40" y="145" class="eyebrow">THREE CENTRAL SUBJECTS</text>
  <g id="construction">
    <rect x="40" y="162" width="282" height="124" rx="12" fill="#fffefb" stroke="#c8dcd0"/>
    <text x="58" y="191" class="title">Construction methods</text>
    <text x="58" y="222" class="body">Implementation &amp; substantial forks</text>
    <text x="58" y="244" class="body">Compilation, search &amp; agents</text>
    <text x="58" y="270" class="label">What is the actual output?</text>
  </g>
  <path d="M330 221 H349" class="line"/>
  <g id="engines">
    <rect x="358" y="162" width="282" height="124" rx="12" fill="#fffefb" stroke="#c8dcd0"/>
    <text x="376" y="191" class="title">Specialized engines</text>
    <text x="376" y="222" class="body">Model, hardware &amp; workload</text>
    <text x="376" y="244" class="body">Execution ownership &amp; reuse</text>
    <text x="376" y="270" class="label">What changed, and why?</text>
  </g>
  <path d="M649 221 H668" class="line"/>
  <g id="validation">
    <rect x="676" y="162" width="282" height="124" rx="12" fill="#fffefb" stroke="#c8dcd0"/>
    <text x="694" y="191" class="title">Validation methods</text>
    <text x="694" y="222" class="body">Numerics, state, quality &amp; service</text>
    <text x="694" y="244" class="body">Coverage, cost &amp; failure limits</text>
    <text x="694" y="270" class="label">What evidence supports acceptance?</text>
  </g>
  <path d="M817 294 V321 H181 V294" class="line"/>
  <rect x="350" y="307" width="300" height="26" rx="10" fill="#e8f1eb"/>
  <text x="500" y="325" text-anchor="middle" class="label">Checking results inform the next revision</text>

  <g id="benchmarks">
    <rect x="40" y="364" width="918" height="65" rx="11" fill="#f7eadb" stroke="#e8d4be"/>
    <text x="58" y="392" class="title">Benchmarks</text>
    <text x="260" y="392" class="body">Tasks, reference implementations &amp; comparison protocols</text>
    <text x="260" y="414" font-size="12" fill="#8d5b39">Keep kernel, model-program and whole-service results distinct.</text>
  </g>

  <text x="40" y="459" class="eyebrow">SUPPORTING RESOURCES</text>
  <g id="support">
    <rect x="40" y="474" width="282" height="62" rx="10" fill="#eeeee8" stroke="#dadfd7"/>
    <text x="58" y="498" font-size="17" font-weight="600">Performance diagnostics</text>
    <text x="58" y="521" font-size="12" fill="#536c76">Profiles → bottlenecks → next experiment</text>
    <rect x="358" y="474" width="282" height="62" rx="10" fill="#eeeee8" stroke="#dadfd7"/>
    <text x="376" y="498" font-size="17" font-weight="600">Construction knowledge</text>
    <text x="376" y="521" font-size="12" fill="#536c76">Hardware findings, recipes &amp; failed attempts</text>
    <rect x="676" y="474" width="282" height="62" rx="10" fill="#eeeee8" stroke="#dadfd7"/>
    <text x="694" y="498" font-size="17" font-weight="600">Reusable components</text>
    <text x="694" y="521" font-size="12" fill="#536c76">Engines, compilers, DSLs &amp; kernels</text>
  </g>
  <text x="40" y="572" font-size="13" fill="#536c76">Research question: when do construction savings survive validation, integration and maintenance?</text>
</svg>

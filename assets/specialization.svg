<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548" role="img" aria-labelledby="specialization-title specialization-desc">
  <title id="specialization-title">Why build a specialized inference stack?</title>
  <desc id="specialization-desc">Core cases follow a four-step chain: known deployment constraints, rebuilding execution decisions, building and validating the system, then deploying and maintaining it. AI-assisted coding and code generation may change construction and maintenance cost; this is a hypothesis to investigate, not a demonstrated benefit. Historical and adjacent routes provide comparison, while general engines, compilers, domain-specific languages, kernel libraries and evaluation tools form shared foundations and baselines. Implementation language does not establish who wrote the code or whether components were reused.</desc>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #173449; }
    .muted { fill: #5d6d77; }
    .teal { fill: #147b76; }
    .orange { fill: #a45632; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .step-title { font-size: 18px; font-weight: 650; }
    .detail { font-size: 13px; fill: #5d6d77; }
    .flow { fill: none; stroke: #147b76; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hypothesis { fill: none; stroke: #b9673f; stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="specialization-arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#147b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hypothesis-arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#b9673f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="548" rx="20" fill="#f7f5ef"/>
  <text x="38" y="33" class="eyebrow teal">WHEN IS A SPECIALIZED INFERENCE STACK WORTH BUILDING?</text>
  <text x="38" y="69" font-size="29" font-weight="650">From deployment constraints to a purpose-built stack</text>
  <text x="38" y="95" font-size="15" class="muted">The execution design and the cost of constructing it are separate questions.</text>

  <g id="core-cases">
    <rect x="20" y="112" width="960" height="268" rx="16" fill="#eaf1eb" stroke="#d5e3d9"/>
    <text x="38" y="137" font-size="16" font-weight="700" class="teal">Core cases</text>
    <text x="158" y="137" font-size="13" class="muted">A deployment target motivates a different execution stack.</text>

    <g id="deployment-constraints">
      <rect x="38" y="153" width="209" height="128" rx="12" fill="#fffefa" stroke="#c7d6cb"/>
      <text x="55" y="181" class="step-title">Known deployment</text>
      <text x="55" y="204" class="step-title">constraints</text>
      <text x="55" y="238" class="detail">Model · hardware</text>
      <text x="55" y="259" class="detail">Workload · quality budget</text>
    </g>
    <path d="M254 217 H268" class="flow" marker-end="url(#specialization-arrow)"/>
    <g id="execution-decisions">
      <rect x="276" y="153" width="209" height="128" rx="12" fill="#fffefa" stroke="#c7d6cb"/>
      <text x="293" y="181" class="step-title">Rebuild execution</text>
      <text x="293" y="204" class="step-title">decisions</text>
      <text x="293" y="238" class="detail">State · data movement</text>
      <text x="293" y="259" class="detail">Scheduling · kernels</text>
    </g>
    <path d="M492 217 H506" class="flow" marker-end="url(#specialization-arrow)"/>
    <g id="build-validate">
      <rect x="514" y="153" width="209" height="128" rx="12" fill="#fffefa" stroke="#c7d6cb"/>
      <text x="531" y="181" class="step-title">Build and validate</text>
      <text x="531" y="238" class="detail">Implement · compare</text>
      <text x="531" y="259" class="detail">Check quality and cost</text>
    </g>
    <path d="M730 217 H744" class="flow" marker-end="url(#specialization-arrow)"/>
    <g id="deploy-maintain">
      <rect x="752" y="153" width="208" height="128" rx="12" fill="#fffefa" stroke="#c7d6cb"/>
      <text x="769" y="181" class="step-title">Deploy &amp; maintain</text>
      <text x="769" y="238" class="detail">Integrate · monitor</text>
      <text x="769" y="259" class="detail">Adapt as targets change</text>
    </g>

    <path d="M618 306 V289" class="hypothesis" marker-end="url(#hypothesis-arrow)"/>
    <path d="M856 306 V289" class="hypothesis" marker-end="url(#hypothesis-arrow)"/>
    <g id="construction-economics-hypothesis">
      <rect x="38" y="306" width="922" height="58" rx="10" fill="#f7eade" stroke="#e8d3c0"/>
      <text x="55" y="330" font-size="15" font-weight="600">AI-assisted coding + code generation</text>
      <text x="55" y="350" font-size="11.5" font-weight="600" class="orange">A construction-cost hypothesis</text>
      <text x="435" y="341" font-size="17" font-weight="500">Can they change build and maintenance cost?</text>
    </g>
  </g>

  <g id="historical-adjacent-routes">
    <rect x="38" y="395" width="922" height="56" rx="11" fill="#fffefa" stroke="#d8dfda"/>
    <text x="55" y="418" font-size="16" font-weight="600">Historical &amp; adjacent routes</text>
    <text x="55" y="440" font-size="13.5" class="muted">Prior bespoke runtimes · specialized backends · compiler-generated execution</text>
  </g>
  <g id="shared-foundations-baselines">
    <rect x="38" y="465" width="922" height="62" rx="11" fill="#efeee8" stroke="#dedfd6"/>
    <text x="55" y="490" font-size="16" font-weight="600">Shared foundations &amp; baselines</text>
    <text x="55" y="514" font-size="13.5" class="muted">General engines · compilers &amp; DSLs · kernel libraries · evaluation</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="specialization-title specialization-desc">
  <title id="specialization-title">Building specialized inference systems</title>
  <desc id="specialization-desc">Known model, hardware, workload and quality constraints shape a specialized execution system, which must be validated and maintained. Four construction routes feed into the system: native implementation, a specialized backend, compiler-generated execution and agent-built programs. General engines, compilers and domain-specific languages, kernel libraries and evaluation tools provide supporting infrastructure. No construction route guarantees better performance.</desc>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #173449; }
    .muted { fill: #5d6d77; }
    .teal { fill: #147b76; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .route { font-size: 17px; font-weight: 600; }
    .line { fill: none; stroke: #147b76; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="specialization-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#147b76" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="20" fill="#f7f5ef"/>
  <text x="38" y="33" class="eyebrow teal">SPECIALIZATION AT THE SYSTEM LEVEL</text>
  <text x="38" y="69" font-size="29" font-weight="650">Build an inference system around its constraints</text>
  <text x="38" y="95" font-size="15" class="muted">The target shapes execution. The construction route can vary.</text>

  <g id="known-constraints">
    <rect x="38" y="122" width="237" height="117" rx="13" fill="#fffefa" stroke="#d8dfda"/>
    <text x="57" y="153" font-size="20" font-weight="600">Known constraints</text>
    <text x="57" y="186" font-size="16" class="muted">Model · hardware</text>
    <text x="57" y="213" font-size="16" class="muted">Workload · quality</text>
  </g>
  <path d="M288 181 H336" class="line" marker-end="url(#specialization-arrow)"/>
  <g id="specialized-system">
    <rect x="349" y="122" width="302" height="117" rx="13" fill="#e9f2ed" stroke="#a9c9bb" stroke-width="1.3"/>
    <text x="500" y="160" font-size="22" font-weight="650" text-anchor="middle">Specialized execution</text>
    <text x="500" y="186" font-size="22" font-weight="650" text-anchor="middle">system</text>
    <text x="500" y="217" font-size="14" class="muted" text-anchor="middle">State · schedule · kernels</text>
  </g>
  <path d="M664 181 H712" class="line" marker-end="url(#specialization-arrow)"/>
  <g id="validation-maintenance">
    <rect x="725" y="122" width="235" height="117" rx="13" fill="#fffefa" stroke="#d8dfda"/>
    <text x="744" y="153" font-size="19" font-weight="600">Validate &amp; maintain</text>
    <text x="744" y="180" font-size="14" class="muted">Correctness · quality</text>
    <text x="744" y="201" font-size="14" class="muted">End-to-end cost</text>
    <text x="744" y="222" font-size="14" class="muted">Maintenance</text>
  </g>

  <text x="38" y="280" class="eyebrow muted">CONSTRUCTION ROUTES</text>
  <path d="M148 330 V310 H850 V330 M382 330 V310 M616 330 V310 M500 310 V251" class="line" marker-end="url(#specialization-arrow)"/>
  <g id="native-implementation">
    <rect x="38" y="330" width="220" height="97" rx="12" fill="#fffefa" stroke="#d8dfda"/>
    <path d="M57 345 H82" stroke="#147b76" stroke-width="3" stroke-linecap="round"/>
    <text x="57" y="370" class="route">Native implementation</text>
    <text x="57" y="405" font-size="13" class="muted">Purpose-built runtime</text>
  </g>
  <g id="specialized-backend">
    <rect x="272" y="330" width="220" height="97" rx="12" fill="#fffefa" stroke="#d8dfda"/>
    <path d="M291 345 H316" stroke="#147b76" stroke-width="3" stroke-linecap="round"/>
    <text x="291" y="370" class="route">Specialized backend</text>
    <text x="291" y="405" font-size="13" class="muted">Adapt an existing stack</text>
  </g>
  <g id="compiler-generated-execution">
    <rect x="506" y="330" width="220" height="97" rx="12" fill="#fffefa" stroke="#d8dfda"/>
    <path d="M525 345 H550" stroke="#b9673f" stroke-width="3" stroke-linecap="round"/>
    <text x="525" y="370" class="route">Compiler-generated</text>
    <text x="525" y="390" class="route">execution</text>
    <text x="525" y="413" font-size="12" class="muted">Lower model / task graphs</text>
  </g>
  <g id="agent-built-programs">
    <rect x="740" y="330" width="220" height="97" rx="12" fill="#fffefa" stroke="#d8dfda"/>
    <path d="M759 345 H784" stroke="#b9673f" stroke-width="3" stroke-linecap="round"/>
    <text x="759" y="370" class="route">Agent-built programs</text>
    <text x="759" y="405" font-size="13" class="muted">Generate, test and revise</text>
  </g>

  <g id="supporting-infrastructure">
    <rect x="38" y="452" width="922" height="64" rx="12" fill="#efeee8" stroke="#dedfd6"/>
    <text x="57" y="475" class="eyebrow muted">SUPPORTING INFRASTRUCTURE</text>
    <text x="57" y="499" font-size="14">General engines</text>
    <text x="291" y="499" font-size="14">Compilers &amp; DSLs</text>
    <text x="525" y="499" font-size="14">Kernel libraries</text>
    <text x="759" y="499" font-size="14">Evaluation</text>
  </g>
</svg>

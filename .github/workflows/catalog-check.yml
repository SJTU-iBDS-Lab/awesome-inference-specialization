name: Check catalog
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate records
        run: python scripts/validate_catalog.py
      - name: Ensure generated views are current
        run: python scripts/update_readme.py --check
      - name: Test catalog tooling and local links
        run: python -m unittest discover -s tests
